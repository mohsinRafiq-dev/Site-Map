<!-- ═══════════════════════════════════════════════════════════════════════════
     FrameUpNow → Plan Fit Visualizer  ·  "See This Plan on Your Property"

     Paste this whole block into ONE Webflow HTML Embed on the plan Collection
     Page template, then bind the two fields marked below.

     How the plan is identified, in priority order:
       1. Plan ID  — the plan's PRADU/Baserow record (e.g. 00159), taken from
          the Plan ID field if the page has one, otherwise from the lookup
          table in Page Settings (see plan-id-map-snippet.html). The tool
          looks it up and gets the lot-based floor plan and true footprint
          straight from the database. This is the same path aduplans.com uses.
       2. Fallback — for plans with no Plan ID yet (the FUN Collection), the
          Width/Depth are read out of the "Dimension" card on the page and the
          home is drawn as a to-scale outline.
     If neither yields anything, the button hides itself.

     ── TWO THINGS TO BIND ─────────────────────────────────────────────────────
     In the embed editor, put the cursor between the quotes and click the purple
     + Add Field button:
        data-planid=""   -> Plan ID
        data-overlay=""  -> Placement Overlay   (optional; leave if unused)
     Empty is fine for either — the plan just falls back to the next option.
     ═══════════════════════════════════════════════════════════════════════ -->

<style>
.fun-place-btn{
  display:none;                       /* revealed by the script once it has a plan */
  align-items:center; justify-content:center; gap:10px;
  width:100%; margin-top:16px; padding:16px 28px;
  border:0; border-radius:9999px;
  background:#5e8e39; color:#fff;
  font-weight:600; font-size:16px; line-height:1.25; font-style:normal;
  text-align:center; text-decoration:none; cursor:pointer;
  box-shadow:0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1);
  transition:background-color .15s cubic-bezier(.4,0,.2,1),
             transform .15s cubic-bezier(.4,0,.2,1);
}
.fun-place-btn.is-ready{ display:inline-flex; }
.fun-place-btn:hover{ background:#4f7830; transform:translateY(-2px); color:#fff; }
.fun-place-btn:focus-visible{ outline:2px solid #5e8e39; outline-offset:2px; }
.fun-place-btn .fun-arrow{ transition:transform .15s cubic-bezier(.4,0,.2,1); }
.fun-place-btn:hover .fun-arrow{ transform:translateX(2px); }
@media(min-width:640px){ .fun-place-btn{ width:auto; } }
</style>

<a class="fun-place-btn" href="#" target="_blank" rel="noopener noreferrer"
   data-planid=""
   data-overlay="">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"/>
    <circle cx="12" cy="10" r="2.5"/>
  </svg>
  See This Plan on Your Property
  <span class="fun-arrow" aria-hidden="true">&rarr;</span>
</a>

<script>
(function () {
  var TOOL = "https://planfitvisualizer.vercel.app";

  var SERIES = {
    "affordable-homes-adus": "FrameUpNow ADU",
    "garage-shop-sheds":     "Garage / Shop",
    "barndominium":          "Barndominium"
  };

  function clean(s) {
    return (s || "").replace(/‍/g, "").replace(/\s+/g, " ").trim();
  }

  // "47'-8\"" -> 47.67   |   "18'" -> 18
  function toFeet(raw) {
    var m = clean(raw).match(/(\d+(?:\.\d+)?)\s*['’′]?(?:\s*-\s*(\d+(?:\.\d+)?)\s*["”″]?)?/);
    if (!m) return null;
    var feet = parseFloat(m[1]);
    if (!isFinite(feet) || feet <= 0) return null;
    var inches = m[2] ? parseFloat(m[2]) : 0;
    return Math.round((feet + (inches || 0) / 12) * 100) / 100;
  }

  // "…/abc123_absolute_43x18.png" -> { W:43, D:18 }
  function dimsFromFilename(url) {
    if (!url) return null;
    var name = decodeURIComponent(String(url).split("?")[0].split("/").pop() || "");
    var m = name.match(/_(\d+(?:\.\d+)?)\s*[x×X]\s*(\d+(?:\.\d+)?)\s*\.[a-z0-9]+$/i);
    if (!m) return null;
    var W = parseFloat(m[1]), D = parseFloat(m[2]);
    return W > 0 && D > 0 ? { W: W, D: D } : null;
  }

  // The Dimension card renders two shapes across the catalogue:
  //   <p>Depth : </p><p>18'</p>   and   <p>Depth: 47'-8"</p>
  // textContent handles both. Label case varies too ("WIdth:").
  function dimsFromPage() {
    var W = null, D = null;
    var items = document.querySelectorAll(".frame-specs_item");
    for (var i = 0; i < items.length; i++) {
      var m = clean(items[i].textContent).match(/^(w\s*idth|depth)\s*:\s*(.+)$/i);
      if (!m) continue;
      var val = toFeet(m[2]);
      if (!val) continue;
      if (/^w/i.test(m[1])) { if (W === null) W = val; }
      else if (D === null) { D = val; }
    }
    return { W: W, D: D };
  }

  function readSqft() {
    var out = null;
    var cells = document.querySelectorAll(".header_key-feature-item");
    for (var i = 0; i < cells.length; i++) {
      var t = clean(cells[i].textContent);
      if (!/livable sq/i.test(t)) continue;
      var m = t.match(/([\d,]+)/);
      if (m) out = parseInt(m[1].replace(/,/g, ""), 10);
    }
    return out && isFinite(out) ? out : null;
  }

  function readName() {
    var h = document.querySelector("h1");
    var n = clean(h && h.textContent);
    return n || clean(document.title).split("|")[0].trim();
  }

  // Slug -> PRADU Plan ID, from the compact table in Page Settings
  // (window.FUN_PLAN_MAP). Used when the page has no Plan ID field of its own.
  var _table = null;
  function lookupPlanId(slug) {
    if (_table === null) {
      _table = {};
      String(window.FUN_PLAN_MAP || "").split(";").forEach(function (grp) {
        var i = grp.indexOf("~");
        if (i < 0) return;
        var city = grp.slice(0, i);
        grp.slice(i + 1).split("|").forEach(function (e) {
          var j = e.lastIndexOf(":");
          if (j < 0) return;
          var rest = e.slice(0, j);
          _table[rest ? city + "-" + rest : city] = e.slice(j + 1);
        });
      });
    }
    return _table[slug] || "";
  }

  function init() {
    var btn = document.querySelector(".fun-place-btn");
    if (!btn) return;

    var seg    = location.pathname.split("/").filter(Boolean);
    var slug   = seg[seg.length - 1] || "plan";
    var planId = clean(btn.getAttribute("data-planid")) || lookupPlanId(slug);
    var q      = new URLSearchParams();

    // ── Preferred: the plan's database record does all the work ──────────────
    if (planId) {
      q.set("plan", planId);
      q.set("src", "frameupnow");
      btn.href = TOOL + "/?" + q.toString();
      btn.classList.add("is-ready");
      return;
    }

    // ── Fallback: no Plan ID yet, so send the footprint from the page ────────
    var overlay = clean(btn.getAttribute("data-overlay"));
    var sqft    = readSqft();
    var dims    = dimsFromFilename(overlay) || dimsFromPage();
    var W = dims.W, D = dims.D;

    // A few plans are missing one dimension on the site. Derive the missing
    // side from livable area rather than hiding the button — the customer can
    // still resize in the tool.
    if (sqft) {
      if (W && !D) D = Math.round((sqft / W) * 100) / 100;
      else if (D && !W) W = Math.round((sqft / D) * 100) / 100;
    }
    if (!W || !D) return;   // nothing to place — leave the button hidden

    q.set("plan", slug);
    q.set("w", String(W));
    q.set("d", String(D));
    if (overlay) q.set("img", overlay);
    if (sqft) q.set("sqft", String(sqft));
    q.set("name", readName());
    q.set("series", SERIES[seg[0]] || "FrameUpNow");
    q.set("src", "frameupnow");

    btn.href = TOOL + "/?" + q.toString();
    btn.classList.add("is-ready");
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
